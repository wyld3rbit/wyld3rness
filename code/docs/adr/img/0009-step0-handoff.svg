<g class="dg-box"><rect x="380" y="190" width="150" height="64" rx="8"/><g transform="translate(385 194) scale(.56)"><path class="i" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path class="i" d="M9 18h6"/><path class="i" d="M10 22h4"/></g><text class="dg-t" x="465" y="216">Incident record</text><text class="dg-s" x="465" y="234">delivered or not</text></g>

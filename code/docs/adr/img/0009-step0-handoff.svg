<g class="dg-box"><rect x="380" y="40" width="150" height="64" rx="8"/><g transform="translate(385 44) scale(.56)"><path class="i" d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path class="i" d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g><text class="dg-t" x="465" y="66">Hand-off</text><text class="dg-s" x="465" y="84">alert from the record</text></g>
<g class="dg-box"><rect x="640" y="40" width="150" height="64" rx="8"/><g transform="translate(645 44) scale(.56)"><path class="i" d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path class="i" d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g><text class="dg-t" x="725" y="66">On-call inbox</text><text class="dg-s" x="725" y="84">the console, for now</text></g>

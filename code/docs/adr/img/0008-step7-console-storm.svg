<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 1180 506" width="1180" height="506" role="img" aria-label="Day 7, step 7: the console drives a storm and shows each try as it happens, or replays a saved one. Solid is built, dashed is planned.">
<style>
.dg-zone { fill: #0d1729; stroke: #2a3a5c; stroke-width: 1; }

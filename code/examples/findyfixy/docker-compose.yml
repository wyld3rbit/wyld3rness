# Day 3 services: Postgres with the pgvector extension, plus Adminer to look at it.
#
# Run from code/ with `make up` and `make down`, which pass -f with this file.
# Stop, wipe data:  docker compose -f examples/findyfixy/docker-compose.yml down -v
#                   (this deletes the pgdata volume)
#
# Supply chain. Both images are pinned by digest, not by tag. A tag can be moved
# to different bytes after we scanned it. A digest cannot. The digest below is the
# multi-arch index, so the same line works on Apple silicon and on x86 CI.
# Both were scanned with Grype v0.120.1 before first use. Results are in
# CHANGELOG.md. To move a digest: pick a build older than 7 days, rescan, update.
#
# Network. Both ports bind to 127.0.0.1. Without that prefix Docker publishes on
# every interface, so anything on your Wi-Fi could reach a database with the
# password "dev". Local-only keeps a dev password acceptable.

# The project name is set here, not taken from the folder this file sits in, so
# a later move of this file never starts a second, empty database. Setting it
# was itself such a move: a clone from before 2026-11-10 still runs the old
# project `code`. Stop it once with `docker compose -p code down`, then
# `make up` and `make ingest`. Its volume `code_pgdata` can then be removed.
name: findyfixy

services:
  db:
    # pgvector/pgvector:pg16 (Debian 12), pushed 2026-10-01.
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    # A small init process runs as PID 1 and reaps orphaned processes. Without
    # it Postgres is PID 1, and when a health check that timed out (under swap)
    # leaves an orphaned pg_isready, Postgres treats its exit as a crashed
    # backend and restarts itself (research log, entry 004).
    init: true
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: rows survive container removal. Without it the data lives in
      # the container's writable layer and `docker compose down` deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres accepts TCP connections a moment before it can serve queries.
      # pg_isready closes that gap, so dependents wait for a usable database.
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    # adminer:6.1.1 (Alpine), pushed 2026-09-30. A stateless web UI: it holds no
    # data, so it can be deleted and recreated freely.
    image: adminer:6.1.1@sha256:74f29c416e148b98305e84446a18db7cd2c1038264dec464359d36774ef080ce
    environment:
      # Pre-fills the "Server" field. Inside the compose network the database is
      # reachable by its service name, not by localhost.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # On call (ADR 0008, step 4; ADR 0009, step 0b): the agent, its edge and the loop, each in
  # its own container, profile "oncall" so a plain `docker compose up` does not start them;
  # `make oncall-up` does, and `make up` runs it.
  #
  #   host 127.0.0.1:8300 + loop token ──► loop ──► agent ──► agent-edge :11434 ──► Ollama POST /api/chat
  #   host 127.0.0.1:8301 (injection suite) ──► agent-edge :8001 ──► agent /decide, /record, /healthz
  #
  # The agent's network is internal: no route out, so no host, no internet, no simprod. Its
  # peers are the loop, which answers it 401 without the loop token, and the agent edge,
  # which forwards only the routes it lists. It holds no Docker socket, no keys, no pass and
  # no token. The boundary probe checks all of that at every `make oncall-up`.
  # All three: read-only, no capabilities, no new privileges.
  agent:
    profiles: [oncall]
    build:
      context: ../..
      dockerfile: examples/findyfixy/Dockerfile
    image: findyfixy-oncall:local
    command: ["python", "-m", "findyfixy.oncall.service", "agent"]
    environment:
      # The model, the budget and the wait come with each incident from the host (make oncall).
      # The model client calls Ollama through the edge's model door.
      OLLAMA_HOST: http://agent-edge:11434
    networks: [agent]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The only container on both the agent's network and an ordinary one (wyld3rness.loop.edge).
  # Docker publishes no port from a container on an internal network alone, so the host's
  # injection suite reaches the agent through here too.
  agent-edge:
    profiles: [oncall]
    image: findyfixy-oncall:local
    pull_policy: never  # built by the agent's build above
    command: ["python", "-m", "findyfixy.oncall.service", "edge"]
    environment:
      OLLAMA_UPSTREAM: http://host.docker.internal:11434
      AGENT_URL: http://agent:8000
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [agent, edge-out]
    ports:
      - "127.0.0.1:8301:8001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      agent: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  loop:
    profiles: [oncall]
    image: findyfixy-oncall:local
    pull_policy: never  # built by the agent's build above; there is nothing to pull
    command: ["python", "-m", "findyfixy.oncall.service", "loop"]
    # The sign pass is readable only by its owner on the host (0600); the loop runs
    # as that user id, passed in by `make oncall-up`, never written here.
    user: "${HOST_UID:-10001}"
    environment:
      AGENT_URL: http://agent:8000
      SIMPROD_EDGE: http://edge:8000
      BAO_ADDR: http://openbao:8200
      BAO_SIGN_FILE: /run/bao/sign.token
      # Only a caller with this token may start an incident or read its events; the
      # host's runner and console read the same file. Written by `make oncall-up` (0600).
      LOOP_TOKEN_FILE: /run/loop/token
      # Traces go to the local Langfuse on the host. Its project keys come from
      # .oncall-trace.env (git-ignored, 0600), written by `make oncall-up` from
      # infra/langfuse/.env; without it tracing is off and the loop runs the same.
      # The agent gets no keys: it reports its model calls to the loop instead.
      LANGFUSE_HOST: http://host.docker.internal:3000
      # Safe-state incidents are handed to the on-call person: by default the console's
      # inbox on the host (`make console`). With nothing listening there, a hand-off is
      # recorded as not delivered. Set HANDOFF_URL to send it elsewhere.
      HANDOFF_URL: ${HANDOFF_URL:-http://host.docker.internal:8765/handoff}
      # Sent with each hand-off, so the inbox can refuse anyone else. Its own token, not the
      # loop's: a hand-off sent elsewhere carries nothing that opens the loop.
      HANDOFF_TOKEN_FILE: /run/handoff/token
    env_file:
      - path: .oncall-trace.env
        required: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../simprod/.bao/sign.token:/run/bao/sign.token:ro
      # Long form, so a missing token file stops compose instead of becoming a directory.
      - type: bind
        source: ./.oncall-loop.token
        target: /run/loop/token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.oncall-handoff.token
        target: /run/handoff/token
        read_only: true
        bind: {create_host_path: false}
    networks: [agent, simprod]
    ports:
      - "127.0.0.1:8300:8000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      agent: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Internal: no default route. Its containers reach each other and nothing else.
  agent:
    internal: true
  # Ordinary: the agent edge's way to the host's Ollama.
  edge-out: {}
  simprod:
    external: true
    name: simprod_outside

volumes:
  pgdata:

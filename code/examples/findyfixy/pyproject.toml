[project]
name = "findyfixy"
version = "0.1.0"
description = "An event detection, determination and mitigation agent: the agent the wyld3rness harness is tested on"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# What the on-call agent needs: the model client, validation and the harness. Its
# container installs only these (examples/findyfixy/Dockerfile).
dependencies = [
    "wyld3rness",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "opentelemetry-api>=1.45.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "simprod",
]

[project.optional-dependencies]
# Triage, retrieval and the tool paths: the router graph, the incident memory in
# Postgres, the embedder and reranker (torch), and MCP. Every local environment
# installs them (`uv sync --all-packages --all-extras`); the agent's image does not.
triage = [
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.16",
    "mcp>=1.30.0,<2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

# Commands. `uv run <name>` from code/; the Makefile wraps the common ones.
[project.scripts]
findyfixy-console = "findyfixy.console.server:main"
findyfixy-triage = "findyfixy.triage.graph:main"
findyfixy-ingest = "findyfixy.retrieval.ingest:main"
findyfixy-search = "findyfixy.retrieval.search:main"
findyfixy-eval = "findyfixy.evals.answers:main"
findyfixy-eval-retrieval = "findyfixy.evals.retrieval:main"
findyfixy-golden = "findyfixy.evals.golden:main"
findyfixy-prices = "findyfixy.observability.prices:main"
findyfixy-mcp-server = "findyfixy.mcp.server:main"
findyfixy-mcp-run = "findyfixy.mcp.run:main"
findyfixy-direct-run = "findyfixy.tools.direct_run:main"
findyfixy-oncall = "findyfixy.oncall.cli:main"
findyfixy-injection = "findyfixy.oncall.attacks:main"

[tool.uv.sources]
wyld3rness = { workspace = true }
simprod = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "simprod"
version = "0.1.0"
description = "A small simulated production (gateway, ledger, notifications) with real load and seeded faults, for testing agents that operate it"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# None, on purpose. The services run in containers on a network with no route
# out, and every line of code in them is in this folder: an inspector reads all
# of it, and no package can phone home or change under us.
dependencies = []

# Host-side drivers. `uv run <name>` from code/; the Makefile wraps them.
[project.scripts]
simprod-loadtest = "simprod.loadtest:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
